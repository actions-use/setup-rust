name: CI
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    name: Test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: ./
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - run: |
          rustup --version
          cargo --version
